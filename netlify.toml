[build]
  publish = "dist"

[[redirects]]
  from = "https://alexlewiscreativeconsultant.com/*"
  to = "https://alexlewiscreative.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.alexlewiscreativeconsultant.com/*"
  to = "https://alexlewiscreative.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
